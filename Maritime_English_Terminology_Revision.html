const DATA={"terms":[{"id":"helm","en":"Helm","gr":"Πηδάλιο χειρισμού / τιμόνι","group":"Basic vocabulary","slide":2,"definition":"The wheel or control used to operate the steering system.","expansion":""},{"id":"helmsman","en":"Helmsman","gr":"Πηδαλιούχος / τιμονιέρης","group":"Basic vocabulary","slide":3,"definition":"The crew member who operates the helm and repeats helm orders.","expansion":""},{"id":"steer","en":"Steer","gr":"Πηδαλιουχώ / κατευθύνω το πλοίο","group":"Basic vocabulary","slide":4,"definition":"Control the ship’s direction.","expansion":""},{"id":"swing","en":"Swing","gr":"Στροφή / μεταβολή διεύθυνσης της πλώρης","group":"Basic vocabulary","slide":5,"definition":"A change in the direction of the bow.","expansion":""},{"id":"rapidly","en":"Rapidly","gr":"Γρήγορα / ταχέως","group":"Basic vocabulary","slide":6,"definition":"Quickly; as rapidly as possible means as quickly as possible.","expansion":""},{"id":"hold","en":"Hold","gr":"Διατηρώ / κρατώ σταθερό","group":"Basic vocabulary","slide":7,"definition":"Maintain the ordered rudder angle or condition.","expansion":""},{"id":"heading","en":"Heading","gr":"Διεύθυνση της πλώρης","group":"Basic vocabulary","slide":8,"definition":"The compass direction in which the bow points.","expansion":""},{"id":"midships","en":"Midships","gr":"Πηδάλιο στη μέση","group":"Helm orders","slide":9,"definition":"Place the rudder in its neutral, generally zero-degree position.","expansion":""},{"id":"port-five","en":"Port five","gr":"Πέντε μοίρες αριστερά","group":"Helm orders","slide":10,"definition":"Apply and hold five degrees of port rudder.","expansion":""},{"id":"starboard-ten","en":"Starboard ten","gr":"Δέκα μοίρες δεξιά","group":"Helm orders","slide":11,"definition":"Apply and hold ten degrees of starboard rudder.","expansion":""},{"id":"starboard-fifteen","en":"Starboard fifteen","gr":"Δεκαπέντε μοίρες δεξιά","group":"Helm orders","slide":12,"definition":"Apply and hold fifteen degrees of starboard rudder.","expa ","why":"The helm controls the steering system.","choices":["helm","heading"]},{"id":"heading","sentence":"The compass shows the vessel’s current ___ as 075 degrees.","why":"Heading is the direction of the bow.","choices":["swing","heading"]},{"id":"steer","sentence":"The officer asks the crew member to ___ the ship on the assigned course.","why":"Steer is the verb for directing the vessel.","choices":["steer","hold"]},{"id":"swing","sentence":"With rudder applied, the bow begins to ___ to starboard.","why":"Swing describes the bow changing direction.","choices":["swing","steer"]},{"id":"rapidly","sentence":"The emergency instruction is to act as ___ as possible.","why":"Rapidly means quickly.","choices":["steady","rapidly"]},{"id":"hold","sentence":"The helmsman must ___ the rudder angle until another order is given.","why":"Hold means maintain the requested position.","choices":["hold","swing"]},{"id":"midships","sentence":"To return the rudder to the neutral position, the officer orders “___”.","why":"Midships means rudder approximately zero degrees.","choices":["steady","midships"]},{"id":"port-five","sentence":"To apply five degrees of left rudder, the order is “___”.","why":"Port means the left side when facing forward.","choices":["port-five","starboard-ten"]},{"id":"starboard-ten","sentence":"The officer requests ten degrees of right rudder: “___”.","why":"Starboard is the vessel’s right side.","choices":["port-five","starboard-ten"]},{"id":"hard-a-port","sentence":"For maximum permitted left rudder, the order is “___”.","why":"Hard-a-port calls for full permitted port rudder.","choices":["port-five","hard-a-port"]},{"id":"meet-her","sentence":"The vessel is still swinging, so the officer orders “___” to check the turn.","why":"Meet her means check the swing using appropriate opposite rudder.","choices":["steady-as-she-goes","meet-her"]},{"id":"steady-as-she-goes","sentence":"To maintain the compass heading at the instant of the order, say “___”.","why":"Steady as she goes refers to the heading then indicated.","choices":["steady","steady-as-she-goes"]},{"id":"adrift","sentence":"After losing control, the ship was carried by the current and became ___.","why":"Adrift means being carried by current, wind or tide.","choices":["adrift","moored"]},{"id":"nuc","sentence":"An exceptional defect prevents a vessel from manoeuvring as required: it may qualify as ___.","why":"NUC stands for Not Under Command. A failure alone does not automatically establish this status.","choices":["hampered","nuc"]},{"id":"underway","sentence":"A vessel not anchored, tied to shore or aground is ___.","why":"Underway is a defined condition, even without motion through the water.","choices":["underway","moored"]},{"id":"moored","sentence":"The ferry is safely ___ alongside the quay with lines.","why":"Moored means secured by mooring lines.","choices":["adrift","moored"]},{"id":"cpa","sentence":"The radar gives a predicted ___ of only 0.8 nautical miles.","why":"CPA is the Closest Point of Approach.","choices":["eta","cpa"]},{"id":"vts","sentence":"The bridge team contacts ___ for traffic information before entering the port.","why":"VTS provides vessel traffic information and services.","choices":["vts","rcc"]},{"id":"tss","sentence":"Vessels use separate lanes in a ___ to organise opposing traffic.","why":"TSS means Traffic Separation Scheme.","choices":["vts","tss"]},{"id":"epirb","sentence":"In a serious emergency, the vessel’s ___ can transmit a satellite distress alert.","why":"EPIRB means Emergency Position-Indicating Radio Beacon.","choices":["epirb","rcc"]},{"id":"gmdss","sentence":"The officer uses ___ equipment for maritime distress and safety communication.","why":"GMDSS is the Global Maritime Distress and Safety System.","choices":["gmdss","vts"]},{"id":"eta","sentence":"The port asks for the vessel’s ___ and the relevant time zone.","why":"ETA means Estimated Time of Arrival.","choices":["eta","cpa"]},{"id":"restricted-area","sentenc g zero-eight-five degrees.","Officer: Keep monitoring CPA and report changes."]},{"title":"A restricted area near the coast","icon":"🗺️","setting":"A coastal warning reports an ordnance exercise inside a restricted area northeast of your vessel. The officer reviews the standing orders and adjusts the voyage plan. Write a bridge exchange with a cautious helm instruction and clear reporting.","required":["restricted-area","ordnance-exercise","standing-orders","cardinal-points","port-five","steady","heading"],"starter":"Officer: The notice warns that ...\nHelmsman: ...","prompts":["Name the activity and restricted area.","Refer to a direction using cardinal points.","Use a helm order, its read-back and a heading report."],"model":["Officer: The warning identifies an ordnance exercise in a restricted area to our north-east. Our standing orders require us to keep clear and report any change.","Officer: The cardinal points on the chart confirm that north-east is ahead and to starboard. We have assessed a safe alteration to port.","Officer: Helmsman, port five. Helmsman: Port five, sir. Helmsman: Port five on.","Officer: Steady. Helmsman: Steady, sir. Helmsman: Swing checked. Heading one-one-zero degrees.","Officer: Continue to monitor our position clear of the restricted area."]},{"title":"An offshore rig move","icon":"⚙️","setting":"Your support vessel is underway near an offshore rig move. The platform’s movement and nearby working vessels hamper manoeuvrability. The deck team checks equipment SWL, while the bridge conducts an agreed alteration using an initial 15° rudder order and then reduces it.","required":["rig-move","hampered","underway","swl","starboard-fifteen","ease-to-ten","hold"],"starter":"Officer: The support vessel is ...\nHelmsman: ...","prompts":["Describe the work and restricted manoeuvrability.","Mention the safe working load.","Use starboard fifteen before ease to ten, with read-backs."],"model":["Officer: We are underway as part of the rig move. The 'use strict';
const TERM=Object.fromEntries(DATA.terms.map(t=>[t.id,t]));
const CATEGORIES=DATA.groups;const TOTAL=DATA.gaps.length+DATA.matching.reduce((a,r)=>a+r.items.length,0)+DATA.scenarios.length;const STORAGE='maritime-revision-evangelia-twochoices-v2';
const fresh=()=>({slide:0,gapIndex:0,gapAnswers:{},match:DATA.matching.map(()=>({index:0,solved:{},misses:{},message:null,lastChoice:null})),scenarioDrafts:{},scenarioDone:{},scenarioFeedback:{},stars:0,streak:0,soundOn:true});
let S=fresh();try{const old=JSON.parse(localStorage.getItem(STORAGE));if(old&&old.gapAnswers&&old.match&&old.scenarioDrafts){S={...fresh(),...old}}}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Audio design follows the earlier Hydra/Sun tense-revision classroom file:
// self-contained Web Audio applause/tones, plus browser female-English TTS.
let audioContext=null,toastTimer=null,speechTimer=null,feedbackCount=0;
function soundContext(){if(!S.soundOn)return null;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;try{if(!audioContext)audioContext=new Ctx();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext}catch(e){return null}}
function tone(ctx,freq,start,duration,volume=.09,type='sine'){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+duration+.01)}
function clap(ctx,start,volume){const length=Math.floor(ctx.sampleRate*.085),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=1100;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+.082);src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(start);src.stop(start+.085)}
function preferredFemaleVoice(){if(!('speechSynthesis'in window))return null;const voices=window.speechSynthesis.getVoices().filter(v=>/^en([_-]|$)/i.test(v.lang||''));const feminine=/female|samantha|serena|sonia|libby|hazel|karen|moira|fiona|victoria|ava|allison|kate|susan|jenny|aria|zira|emma|olivia|natasha|catherine|martha|tessa|siri|google uk english female/i;const masculine=/\bmale\b|daniel|alex|fred|tom|david|mark|george|james|oliver|arthur|brian/i;const candidates=voices.filter(v=>feminine.test(v.name)&&!masculine.test(v.name));candidates.sort((a,b)=>{const score=v=>(/female/i.test(v.name)?90:0)+(/en[-_]GB/i.test(v.lang)?15:0)+(/serena|sonia|samantha|karen|moira|google uk english female/i.test(v.name)?12:0)+(v.localService?3:0);return score(b)-score(a)});return candidates[0]||null}
function speakFeedback(correct){clearTimeout(speechTimer);if(!S.soundOn||!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))return;try{window.speechSynthesis.cancel()}catch(e){}speechTimer=setTimeout(()=>{if(!S.soundOn)return;try{const phrase=new SpeechSynthesisUtterance(correct?'Way to go!':'Try again!');const female=preferredFemaleVoice();if(female){phrase.voice=female;phrase.lang=female.lang}else phrase.lang='en-GB';phrase.rate=correct?.98:.92;phrase.pitch=female?1.10:1.38;phrase.volume=1;window.speechSynthesis.speak(phrase)}catch(e){}},correct?490:290)}
function playFeedback(correct){feedbackCount++;const toast=$('feedback-toast');toast.className='feedback-toast show '+(correct?'success':'try-again');toast.textContent=correct?'👏 WAY TO GO!':'💛 TRY AGAIN!';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='feedback-toast',1550);if(!S.soundOn)return;const ctx=soundContext();if(ctx){try{const start=ctx.currentTime+.035;if(correct){const tunes=[[523.25,659.25,783.99],[587.33,739.99,880],[659.25,783.99,987.77]],notes=tunes[feedbackCount%tunes.length];for(let i=0;i<9;i++)clap(ctx,start+i*.044+(Math.random()*.014),.46+Math.random()*.24);notes.forEach((f,i)=>tone(ctx,f,start+.04+i*.13,.19,.048,'triangle'))}else{const notes=feedbackCount%2?[349.23,293.66]:[392,329.63];notes.forEach((f,i)=>tone(ctx,f,start+i*.14,.16,.065,'sine'))}}catch(e){}}speakFeedback(correct)}
function toggleSound(){S.soundOn=!S.soundOn;if(!S.soundOn){clearTimeout(speechTimer);try{window.speechSynthesis?.cancel()}catch(e){}}updateSoundButton();save()}

const greek=id=>`<span class="greek">(${esc(TERM[id].gr)})</span>`;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}}

function intro(k,t,d){return `<div class="section-tag"><i></i>${k}</div><h2>${t}</h2><p class="lead">${d}</p>`}

function welcome(){return `<div class="hero"><div><div class="section-tag"><i></i>Maritime terminology · Revision</div><h1>All hands on <span style="color:#1285a8">deck!</span></h1><p class="lead">Practise the language of helm orders, vessel conditions, traffic services and safety communications. Use the Greek translations whenever you need support.</p><div class="chiprow"><span class="chip">⚓ 39 source terms</span><span class="chip">✍️ Gap filling</span><span class="chip">🧩 Matching</span><span class="chip">🧭 Bridge scenarios</span></div><button class="cta" data-action="goto" data-slide="1">Begin revision →</button><p class="small-note">Classroom simulation only. Real navigation follows approved bridge procedures and regulations.</p></div><div class="sea"><span class="sun"></span><span class="ship">🚢</span><span class="wave"></span></div></div>`}
function overview(){return `${intro('Your route','Three activities, one maritime mission','You can use the Glossary at any time. Each term appears with a smaller Greek translation to support revision.')}<div class="mission-grid"><div class="tile"><div class="emoji">✍️</div><h3>1. Complete the gap</h3><p>${DATA.gaps.length} practical maritime sentences. Pick the correct term from exactly two choices, A or B.</p></div><div class="tile"><div class="emoji">🧩</div><h3>2. Connect the terms</h3><p>Two matching rounds. Match each maritime situation to one of two possible terminology items.</p></div><div class="tile"><div class="emoji">🧭</div><h3>3. Bridge situations</h3><p>Write short crew exchanges using given vocabulary and helm orders. Check the word-use checklist.</p></div></div><div class="banner">💡 Every A/B choice gives immediate feedback, applause and “Way to go!” for correct answers, or “Try again!” for incorrect answers. Creative scenarios receive vocabulary feedback; your teacher assesses the navigation logic.</div><div style="margin-top:22px"><button class="cta" data-action="goto" data-slide="2">View the terminology map →</button></div>`}
function categories(){const icons=['🧭','⚙️','🚢','📡','🗺️'];return `${intro('Source vocabulary','39 terms from the first 40 slides','Five vocabulary groups from the PowerPoint. Search all English expressions, Greek translations and full acronym forms with the Glossary button.')}<div class="group-grid">${CATEGORIES.map((g,i)=>{const n=DATA.terms.filter(x=>x.group===g).length;return `<div class="group-card"><div style="font-size:28px">${icons[i]}</div><strong>${n}</strong><b>${esc(g)}</b><small>terms</small></div>`}).join('')}</div><div class="banner">Examples: <b>Steady as she goes</b> ${greek('steady-as-she-goes')}, <b>CPA</b> ${greek('cpa')}, <b>Restricted area</b> ${greek('restricted-area')}.</div><div style="margin-top:22px"><button class="cta" data-action="goto" data-slide="3">Start gap filling →</button></div>`}
function gaps(){const i=S.gapIndex;if(i>=DATA.gaps.length)return `${intro('Activity 1 completed','All gaps filled! ✅','You have completed the sentence task. Continue with the two-choice matching challenge.')}<button class="cta" data-action="goto" data-slide="4">Go to matching →</button>`;const q=DATA.gaps[i],term=TERM[q.id],a=S.gapAnswers[i]||{tries:0,solved:false};return `<div class="section-tag"><i></i>Activity 1 · Context gap filling · Two choices</div><div class="game"><div class="panel"><div class="counter">Sentence ${i+1} of ${DATA.gaps.length}</div><div class="question">${esc(q.sentence).replace('___','<span class="blank">________</span>')}</div><div class="translation"><span class="label">Greek clue · Ελληνική σημασία</span><div style="margin-top:6px">${greek(q.id)}</div></div><div class="label">Choose the missing term · A or B</div><div class="choice-grid">${q.choices.map((id,n)=>`<button class="choice-card ${a.lastChoice===id?(a.solved?'correct':'wrong'):''}" data-action="answer-gap" data-choice="${esc(id)}" ${a.solved?'disabled':''}><span class="choice-letter">${n?'B':'A'}</span><span>${esc(TERM[id].en)}</span></button>`).join('')}</div>${a.tries?`<div class="feedback ${a.solved?'':'wrong'}" role="status"><strong>${a.solved?'👏 Way to go!':'💛 Try again!'}</strong><div>${a.solved?esc(q.why):'Read the sentence and Greek clue again. Choose the other option if needed.'}</div></div>`:''}<div class="actions"><span class="counter">${Object.values(S.gapAnswers).filter(x=>x.solved).length} / ${DATA.gaps.length} completed</span>${a.solved?`<button class="cta" data-action="next-gap">${i===DATA.gaps.length-1?'Finish gaps':'Next sentence →'}</button>`:''}</div></div><aside class="side"><div class="icon">⚓</div><h3>Bridge vocabulary</h3><p>Choose one of just two English terms. You receive an immediate sound and spoken feedback.</p><div class="progressbar"><span style="width:${Object.values(S.gapAnswers).filter(x=>x.solved).length/DATA.gaps.length*100}%"></span></div><p class="small-note">Source: slide ${term.slide}. Use the Glossary if you need a definition.</p></aside></div>`}
function matching(round){const r=DATA.matching[round],m=S.match[round],done=Object.keys(m.solved).length,i=m.index;if(i>=r.items.length)return `<div class="section-tag"><i></i>Activity 2 · Matching ${round+1} of 2</div>${intro('Matching challenge','Excellent connections! ✅','You have matched all ten maritime situations in this round.')}<div class="banner">✅ ${done} / ${r.items.length} correct matches</div><div style="margin-top:24px"><button class="cta" data-action="goto" data-slide="${round===0?5:6}">Continue →</button></div>`;const item=r.items[i],answered=!!m.solved[i];return `<div class="section-tag"><i></i>Activity 2 · Matching ${round+1} of 2 · Two choices</div>${intro('Matching challenge',r.name,'Read the maritime situation, then match it to the correct term. There are exactly two options, with Greek support.')}<div class="game"><div class="panel"><div class="counter">Match ${i+1} of ${r.items.length}</div><div class="question">${esc(item.clue)}</div><div class="label">Which maritime term matches this situation?</div><div class="choice-grid">${item.choices.map((id,n)=>`<button class="choice-card ${m.lastChoice===id?(answered?'correct':'wrong'):''}" data-action="answer-match" data-round="${round}" data-choice="${esc(id)}" ${answered?'disabled':''}><span class="choice-letter">${n?'B':'A'}</span><span>${esc(TERM[id].en)}${greek(id)}</span></button>`).join('')}</div>${m.message?`<div class="feedback ${m.message.ok?'':'wrong'}" role="status"><b>${m.message.ok?'👏 Way to go!':'💛 Try again!'}</b> ${esc(m.message.text)}</div>`:''}<div class="actions"><span class="counter">${done} / ${r.items.length} matched</span>${answered?`<button class="cta" data-action="next-match" data-round="${round}">${i===r.items.length-1?'Finish round':'Next match →'}</button>`:''}</div></div><aside class="side"><div class="icon">🧩</div><h3>Make the connection</h3><p>Use the meaning of the situation to choose between term A and term B. Listen to the feedback after each answer.</p><div class="progressbar"><span style="width:${100*done/r.items.length}%"></span></div><p class="small-note">The vocabulary comes from the original maritime slides.</p></aside></div>`}
function normal(s){return String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ')}
function containsTerm(text,t){const a=normal(text),b=normal(t.en);if((' '+a+' ').includes(' '+b+' '))return true;if(t.expansion&&(' '+a+' ').includes(' '+normal(t.expansion)+' '))return true;return false}
function words(s){return s.trim()?s.trim().split(/\s+/).length:0}
function scenario(idx){const s=DATA.scenarios[idx],draft=S.scenarioDrafts[idx]||'',hits=s.required.filter(id=>containsTerm(draft,TERM[id])),done=!!S.scenarioDone[idx],feedback=S.scenarioFeedback[idx];return `<div class="section-tag"><i></i>Activity 3 · Bridge situation ${idx+1} of ${DATA.scenarios.length}</div>${intro('Bridge writing',`${s.icon} ${esc(s.title)}`,'Build a vessel situation and write an exchange between the officer and the helmsman or radio officer. Include the listed maritime terminology.') }<div class="scenario"><div><div class="setting"><strong>Situation:</strong> ${esc(s.setting)}</div><div class="termchips">${s.required.map(id=>`<span class="termchip ${hits.includes(id)?'used':''}">${hits.includes(id)?'✓ ':''}${esc(TERM[id].en)}${greek(id)}</span>`).join('')}</div><textarea id="scenario-text" class="writing" placeholder="${esc(s.starter)}" aria-label="Your maritime scenario">${esc(draft)}</textarea><div class="actions"><span class="counter" id="scenario-count">${words(draft)} words · ${hits.length}/${s.required.length} target terms</span><button class="cta" data-action="check-scenario">Check my scenario</button></div>${feedback?`<div class="feedback ${feedback.ok?'':'wrong'}" role="status"><strong>${feedback.ok?'✅ Vocabulary checklist complete!':'📝 Continue writing.'}</strong><div>${esc(feedback.text)}</div></div>`:''}${done?`<div class="actions"><span class="counter">✓ Submitted for teacher review</span><button class="cta" data-action="goto" data-slide="${idx===DATA.scenarios.length-1?10:idx+7}">${idx===DATA.scenarios.length-1?'See results':'Next situation →'}</button></div>`:''}</div><aside class="checklist"><h3>Writing checklist</h3><ul>${s.prompts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="review">The automatic check confirms vocabulary coverage and a minimum length of 40 words. Your teacher checks if the helm orders and navigation decisions make sense.</div><p class="small-note">Tip: Use an order, a repeat-back, a report of the result and further monitoring.</p></aside></div>`}
function finalSlide(){const done=count(),pct=Math.round(done/TOTAL*100),complete=done===TOTAL;return `<div class="final"><div class="trophy">${complete?'🏆':'🧭'}</div>${intro('Revision report',complete?'You have completed the voyage!':'Your maritime revision progress',complete?'Well done! You completed all three classroom activities.':'Continue any activity whenever you are ready. Your work is saved in this browser.') }<div class="stats"><div class="stat"><strong>${done}/${TOTAL}</strong><span>Tasks completed</span></div><div class="stat"><strong>⭐ ${S.stars}</strong><span>First-try stars</span></div><div class="stat"><strong>${pct}%</strong><span>Overall progress</span></div></div><div class="chiprow" style="justify-content:center"><span class="chip">Gap filling: ${Object.values(S.gapAnswers).filter(x=>x.solved).length}/${DATA.gaps.length}</span><span class="chip">Matching: ${S.match.reduce((a,m)=>a+Object.keys(m.solved).length,0)}/20</span><span class="chip">Scenarios: ${Object.keys(S.scenarioDone).length}/4</span></div><div class="actions" style="justify-content:center"><button class="cta" data-action="goto" data-slide="3">Review activities</button><button class="cta secondary" data-action="reset">↻ Start Over</button></div><p class="small-note">Creative scenes are checked for required terminology only. The teacher assesses communicative clarity and safe, logical navigation.</p></div>`}
function render(){const slide=[welcome,overview,categories,gaps,()=>matching(0),()=>matching(1),()=>scenario(0),()=>scenario(1),()=>scenario(2),()=>scenario(3),finalSlide][S.slide];$('stage').innerHTML=slide();$('score').textContent=`⭐ ${S.stars} · ${count()}/${TOTAL}`;$('slide-count').textContent=`${String(S.slide+1).padStart(2,'0')} / 11`;$('deck-progress').style.width=`${(S.slide+1)/11*100}%`;$('prev').disabled=S.slide===0;$('next').disabled=S.slide===10;updateSoundButton();save()}
function goto(n){S.slide=Math.max(0,Math.min(10,n));render();window.scrollTo({top:0,behavior:'instant'})}
function answerGap(choice){const i=S.gapIndex,q=DATA.gaps[i],a=S.gapAnswers[i]||{tries:0,solved:false};if(a.solved||!q.choices.includes(choice))return;a.tries++;a.lastChoice=choice;const ok=choice===q.id;if(ok){a.solved=true;award(a.tries===1)}else S.streak=0;S.gapAnswers[i]=a;playFeedback(ok);render()}
function nextGap(){S.gapIndex++;render()}
function answerMatch(r,choice){const m=S.match[r],i=m.index,item=DATA.matching[r].items[i];if(!item||m.solved[i]||!item.choices.includes(choice))return;m.lastChoice=choice;const ok=choice===item.id;if(ok){m.solved[i]=true;award(!m.misses[i]);m.message={ok:true,text:TERM[item.id].en+' correctly matches this situation.'}}else{m.misses[i]=(m.misses[i]||0)+1;S.streak=0;m.message={ok:false,text:'Check the detail in the situation and compare the two maritime terms.'}}playFeedback(ok);render()}
function nextMatch(r){const m=S.match[r];if(!m.solved[m.index])return;m.index++;m.lastChoice=null;m.message=null;render()}
function checkScenario(){const i=S.slide-6,s=DATA.scenarios[i],draft=$('scenario-text').value;S.scenarioDrafts[i]=draft;const found=s.required.filter(id=>containsTerm(draft,TERM[id])),enough=words(draft)>=40,ok=enough&&found.length===s.required.length;if(ok){S.scenarioDone[i]=true;S.scenarioFeedback[i]={ok:true,text:'All required expressions appear. Your teacher will assess the order–read-back sequence and maritime judgement.'}}else{delete S.scenarioDone[i];const missing=s.required.filter(id=>!found.includes(id)).map(id=>TERM[id].en);S.scenarioFeedback[i]={ok:false,text:`${found.length}/${s.required.length} terms included. ${enough?'Length is sufficient.':'Write at least 40 words.'} ${missing.length?'Still missing: '+missing.join(', ')+'.':''}`}}playFeedback(ok);render()}
function glossaryList(query=''){const q=normal(query);const arr=DATA.terms.filter(t=>!q||normal(t.en+' '+t.gr+' '+(t.expansion||'')+' '+t.definition).includes(q));$('gloss-list').innerHTML=arr.length?CATEGORIES.map(g=>{const ts=arr.filter(x=>x.group===g);return ts.length?`<div class="gloss-group">${esc(g)} (${ts.length})</div>${ts.map(t=>`<div class="gloss-term"><strong>${esc(t.en)}</strong>${t.expansion?`<div class="small-note" style="margin:2px 0">${esc(t.expansion)}</div>`:''}<div class="greek">(${esc(t.gr)})</div><p>${esc(t.definition)}</p><div class="source">Source slide ${t.slide}</div></div>`).join('')}`:''}).join(''):'<p class="muted">No matching terms.</p>'}
function openGlossary(){const p=$('glossary');p.classList.add('open');$('overlay').classList.add('open');$('gloss-search').value='';glossaryList();$('gloss-search').focus()}
function closeGlossary(){$('glossary').classList.remove('open');$('overlay').classList.remove('open')}
function reset(){if(!confirm('Start over the WHOLE revision? All answers, matching pairs, scenario drafts, stars and progress will be cleared.'))return;const wasSoundOn=S.soundOn;S=fresh();S.soundOn=wasSoundOn;clearTimeout(speechTimer);try{window.speechSynthesis?.cancel()}catch(e){}closeGlossary();save();goto(0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'goto':goto(Number(b.dataset.slide));break;case'prev':goto(S.slide-1);break;case'next':goto(S.slide+1);break;case'reset':reset();break;case'toggle-sound':toggleSound();break;case'glossary':openGlossary();break;case'close-glossary':closeGlossary();break;case'answer-gap':answerGap(b.dataset.choice);break;case'next-gap':nextGap();break;case'answer-match':answerMatch(Number(b.dataset.round),b.dataset.choice);break;case'next-match':nextMatch(Number(b.dataset.round));break;case'check-scenario':checkScenario();break;case'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();break;}});
document.addEventListener('input',e=>{if(e.target.id==='scenario-text'){const i=S.slide-6,Sv=DATA.scenarios[i],t=e.target.value;S.scenarioDrafts[i]=t;delete S.scenarioDone[i];delete S.scenarioFeedback[i];const hits=Sv.required.filter(id=>containsTerm(t,TERM[id]));$('scenario-count').textContent=`${words(t)} words · ${hits.length}/${Sv.required.length} target terms`;document.querySelectorAll('.termchip').forEach((el,j)=>el.classList.toggle('used',hits.includes(Sv.required[j])));save()}if(e.target.id==='gloss-search')glossaryList(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGlossary();if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||$('glossary').classList.contains('open'))return;if(e.key==='ArrowLeft')goto(S.slide-1);if(e.key==='ArrowRight')goto(S.slide+1)});
render();
</script></body></html>
